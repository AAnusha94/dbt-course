version: 2

models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          config:
            severity: error
    columns:
      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment/room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Shared room', 'Private room', 'Hotel room', 'Entire home/apt']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: Cleansed table which contains Airbnb hosts details.
    config: 
      contract: 
        enforced: true
    columns:
      - name: host_id
        description: Primary key for hosts
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique

      - name: host_name
        description: Name of the host
        data_type: string
        constraints:
          - type: not_null

      - name: is_superhost
        description: If the host is superhost or not
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['f','t']

      - name: created_at
        description: When was the record created
        data_type: timestamp
      - name: updated_at
        description: When was record the updated
        data_type: timestamp

  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - not_null

      - name: reviewer_name
        data_tests:
          - not_null
      
